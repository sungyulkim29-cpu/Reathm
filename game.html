<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Rhythm Tribute</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% -10%, #1c2430 0%, #10141c 55%, #0a0d13 100%);
    font-family: Georgia, 'Times New Roman', serif;
    color: #EDE3D0;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    width: 100%; height: 100vh; min-height: 640px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .deco-corner { position: absolute; opacity: .35; width: 64px; height: 64px; }
  .screen { text-align: center; padding: 24px; z-index: 2; width: 100%; max-width: 480px; max-height: 100%; overflow-y: auto; }
  .eyebrow { font-size: 13px; letter-spacing: 6px; color: #C9A24B; margin-bottom: 10px; text-transform: uppercase; }
  h1 { font-size: clamp(28px, 6vw, 48px); margin: 0 0 6px; font-weight: 700; letter-spacing: 1px; color: #F3E9D2; text-shadow: 0 0 24px rgba(201,162,75,.35); }
  .sub { font-size: 14px; color: #9AA5B1; margin-bottom: 24px; }

  .section-label { font-size: 11px; letter-spacing: 3px; color: #8a93a0; text-transform: uppercase; margin: 18px 0 10px; text-align: left; }

  .song-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .song-card { flex: 1 1 calc(50% - 5px); min-width: 130px; }
  .song-card {
    flex: 1; padding: 14px 10px; border-radius: 10px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.10); background: rgba(255,255,255,.03);
    transition: border-color .12s, background .12s, transform .08s;
  }
  .song-card .song-title { font-size: 14px; font-weight: 700; color: #EDE3D0; margin-bottom: 4px; }
  .song-card .song-sub { font-size: 11px; color: #8a93a0; }
  .song-card.selected { transform: translateY(-2px); }

  .diff-row { display: flex; gap: 10px; }
  .diff-chip {
    flex: 1; padding: 12px 8px; border-radius: 10px; cursor: pointer;
    border: 2px solid rgba(255,255,255,.10); background: rgba(255,255,255,.03);
    font-size: 14px; font-weight: 700; color: #c8ccd2;
    transition: border-color .12s, background .12s, color .12s, transform .08s;
  }
  .diff-chip.selected { transform: translateY(-2px); }
  .diff-desc { font-size: 11px; color: #6b7480; margin-top: 6px; text-align: left; }

  .keys-row { display: flex; gap: 14px; justify-content: center; margin: 26px 0 22px; }
  .key-chip { width: 50px; height: 50px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }

  .btn { background: linear-gradient(180deg,#D9B968,#B5893A); color: #1a1305; border: none; padding: 14px 38px; font-size: 17px; font-weight: 700; letter-spacing: 2px; border-radius: 4px; cursor: pointer; box-shadow: 0 6px 0 #7a5c22, 0 10px 20px rgba(0,0,0,.4); width: 100%; max-width: 280px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7a5c22; }
  .hint { margin-top: 14px; font-size: 12px; color: #6b7480; }

  #playing { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 720px; display: none; overflow: hidden; border-radius: 8px; }
  #playBg {
    position: absolute; inset: 0;
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    image-rendering: pixelated;
    filter: saturate(0.9);
    z-index: 0;
  }
  #playBg::after { content: ""; }
  #playOverlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(10,13,19,.55) 0%, rgba(10,13,19,.72) 60%, rgba(10,13,19,.88) 100%);
    z-index: 1;
  }
  .hud { position: absolute; top: 18px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 18px; z-index: 5; }
  .hud-label { font-size: 11px; color: #9AA5B1; letter-spacing: 2px; }
  .hud-value { font-size: 26px; font-weight: 700; color: #F3E9D2; }
  .hud-combo { font-size: 26px; font-weight: 700; color: #5b6169; text-align: right; }
  .hud-diff { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 2px; color: #6b7480; text-align: center; }

  .lanes { position: absolute; top: 70px; bottom: 0; left: 0; right: 0; display: flex; z-index: 2; }
  .lane { flex: 1; position: relative; cursor: pointer; transition: background .06s; touch-action: manipulation; }
  .lane + .lane { border-left: 1px solid rgba(255,255,255,.06); }
  .hit-line { position: absolute; top: 82%; left: 4px; right: 4px; height: 4px; border-radius: 2px; background: rgba(201,162,75,.35); transition: background .06s, box-shadow .06s; pointer-events: none; }
  .tap-pad {
    position: absolute; left: 5px; right: 5px; bottom: 14px; top: 86%;
    min-height: 90px;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
    display: flex; align-items: center; justify-content: center;
    transition: background .08s, transform .08s, border-color .08s;
    overflow: visible;
  }
  .tap-pad.pressed { transform: scale(0.94); }
  .burst-particle {
    position: absolute; left: 50%; top: 50%;
    width: 7px; height: 7px; border-radius: 50%;
    pointer-events: none;
    animation: burstFly .40s ease-out forwards;
  }
  @keyframes burstFly {
    0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.25); opacity: 0; }
  }
  .ring-pulse {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid; pointer-events: none;
    animation: ringPulse .40s ease-out forwards;
  }
  @keyframes ringPulse {
    0%   { transform: translate(-50%, -50%) scale(0.4); opacity: .9; }
    100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
  }
  .key-label { font-size: 20px; font-weight: 700; opacity: .8; pointer-events: none; }
  .note { position: absolute; left: 6px; right: 6px; height: 22px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); will-change: top; }
  .popup { position: absolute; top: calc(86% - 40px); left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 8px rgba(0,0,0,.6); pointer-events: none; animation: floatUp .42s ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -18px); } }

  #result { display: none; }
  .rank { font-size: 72px; font-weight: 700; color: #F3E9D2; text-shadow: 0 0 30px rgba(201,162,75,.4); margin-bottom: 4px; }
  .stat-grid { display: inline-grid; grid-template-columns: auto auto; row-gap: 8px; column-gap: 24px; font-size: 14px; color: #c8ccd2; margin-bottom: 26px; text-align: left; }
  .stat-key { color: #9AA5B1; }
</style>
</head>

<div id="app">

  <div class="screen" id="intro">
    <div class="eyebrow">Rhythm Tribute</div>
    <h1 id="titlePreview">곡을 선택하세요</h1>
    <div class="sub" id="subPreview">&nbsp;</div>

    <div class="section-label">곡 선택</div>

  </div>

  <div id="playing">
    <div id="playBg"></div>
    <div id="playOverlay"></div>
    <div class="hud">
      <div>
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="scoreVal">0</div>
      </div>
      <div class="hud-diff" id="hudDiff">NORMAL</div>
      <div style="text-align:right">
        <div class="hud-label">COMBO</div>
        <div class="hud-combo" id="comboVal">0</div>
      </div>
    </div>
    <div class="lanes" id="lanes"></div>
  </div>

  <div class="screen" id="result">
    <div class="eyebrow">CURTAIN CALL</div>
    <div class="rank" id="rankVal">C</div>
    <div class="sub" id="accVal">정확도 0.0%</div>
    <div class="stat-grid" id="statGrid"></div>
    <div><button class="btn" id="retryBtn">다시 하기 (Space)</button></div>
    <div class="hint" id="changeLink" style="cursor:pointer; text-decoration: underline;">다른 곡 · 난이도 선택</div>
  </div>

  <audio id="audio" preload="auto"></audio>
</div>

const LANE_KEYS = ["A", "S", "D", "F"];
const LANE_COLORS = ["#C9A24B", "#B5673A", "#7A8B6F", "#5E7C8A"];
const HIT_Y = 82;

let selectedSong = "jitterbug";
let selectedDiff = "normal";
let LEAD_TIME, WINDOW_PERFECT, WINDOW_GOOD, WINDOW_MISS;

const audio = document.getElementById("audio");

const introEl = document.getElementById("intro");
const playingEl = document.getElementById("playing");
const resultEl = document.getElementById("result");
const lanesEl = document.getElementById("lanes");
const scoreValEl = document.getElementById("scoreVal");
const comboValEl = document.getElementById("comboVal");
const hudDiffEl = document.getElementById("hudDiff");

let notes = [];
let score = 0, combo = 0, maxCombo = 0;
let judgeCounts = { PERFECT: 0, GOOD: 0, OK: 0, MISS: 0 };
let rafId = null;
let laneEls = [], hitLineEls = [], noteContainerEls = [], tapPadEls = [];
let laneKeyDown = [false, false, false, false];

function buildKeysRow() {
  const row = document.getElementById("keysRow");
  row.innerHTML = "";
  LANE_KEYS.forEach((k, i) => {
    const chip = document.createElement("div");
    chip.className = "key-chip";
    chip.style.border = `2px solid ${LANE_COLORS[i]}`;
    chip.style.color = LANE_COLORS[i];
    chip.style.boxShadow = `0 0 14px ${LANE_COLORS[i]}55`;
    chip.textContent = k;
    row.appendChild(chip);
  });
}

function buildSongRow() {
  const row = document.getElementById("songRow");
  row.innerHTML = "";
  Object.keys(SONGS).forEach((key) => {
    const song = SONGS[key];
    const card = document.createElement("div");
    card.className = "song-card" + (key === selectedSong ? " selected" : "");
    card.style.borderColor = key === selectedSong ? song.accent : "rgba(255,255,255,.10)";
    card.style.background = key === selectedSong ? song.accent + "1a" : "rgba(255,255,255,.03)";
    card.innerHTML = `<div class="song-title">${song.title}</div><div class="song-sub">${song.subtitle}</div>`;
    card.addEventListener("pointerdown", () => { selectedSong = key; refreshIntro(); });
    row.appendChild(card);
  });
}

function buildDiffRow() {
  const row = document.getElementById("diffRow");
  row.innerHTML = "";
  const accent = SONGS[selectedSong].accent;
  Object.keys(DIFFICULTIES).forEach((key) => {
    const diff = DIFFICULTIES[key];
    const chip = document.createElement("div");
    chip.className = "diff-chip" + (key === selectedDiff ? " selected" : "");
    chip.style.borderColor = key === selectedDiff ? accent : "rgba(255,255,255,.10)";
    chip.style.background = key === selectedDiff ? accent + "1a" : "rgba(255,255,255,.03)";
    chip.style.color = key === selectedDiff ? "#F3E9D2" : "#c8ccd2";
    chip.textContent = diff.label;
    chip.addEventListener("pointerdown", () => { selectedDiff = key; refreshIntro(); });
    row.appendChild(chip);
  });
  document.getElementById("diffDesc").textContent = DIFFICULTIES[selectedDiff].desc;
}

function refreshIntro() {
  const song = SONGS[selectedSong];
  document.getElementById("titlePreview").textContent = song.title;
  document.getElementById("subPreview").textContent = song.subtitle;
  buildSongRow();
  buildDiffRow();
}

function buildLanes() {
  lanesEl.innerHTML = "";
  laneEls = []; hitLineEls = []; noteContainerEls = []; tapPadEls = [];
  for (let lane = 0; lane < 4; lane++) {
    const laneEl = document.createElement("div");
    laneEl.className = "lane";

    const hitLine = document.createElement("div");
    hitLine.className = "hit-line";
    laneEl.appendChild(hitLine);

    const noteContainer = document.createElement("div");
    noteContainer.style.position = "absolute";
    noteContainer.style.inset = "0";
    laneEl.appendChild(noteContainer);

    const tapPad = document.createElement("div");
    tapPad.className = "tap-pad";
    tapPad.style.borderColor = LANE_COLORS[lane] + "55";

    const keyLabel = document.createElement("div");
    keyLabel.className = "key-label";
    keyLabel.style.color = LANE_COLORS[lane];
    keyLabel.textContent = LANE_KEYS[lane];
    tapPad.appendChild(keyLabel);
    laneEl.appendChild(tapPad);

    laneEl.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      try { laneEl.setPointerCapture(e.pointerId); } catch (err) {}
      if (!laneKeyDown[lane]) { laneKeyDown[lane] = true; pressLane(lane); }
    });
    laneEl.addEventListener("pointerup", (e) => { laneKeyDown[lane] = false; releaseLane(lane); });
    laneEl.addEventListener("pointercancel", (e) => { laneKeyDown[lane] = false; releaseLane(lane); });

    lanesEl.appendChild(laneEl);
    laneEls.push(laneEl);
    hitLineEls.push(hitLine);
    noteContainerEls.push(noteContainer);
    tapPadEls.push(tapPad);
  }
}

function judge(dt) {
  const a = Math.abs(dt);
  if (a <= WINDOW_PERFECT) return "PERFECT";
  if (a <= WINDOW_GOOD) return "GOOD";
  if (a <= WINDOW_MISS) return "OK";
  return null;
}

function spawnPopup(lane, text, color) {
  const el = document.createElement("div");
  el.className = "popup";
  el.style.color = color;
  el.textContent = text;
  laneEls[lane].appendChild(el);
  setTimeout(() => el.remove(), 420);
}

function spawnBurst(lane) {
  const tapPad = tapPadEls[lane];
  const color = LANE_COLORS[lane];

  const ring = document.createElement("div");
  ring.className = "ring-pulse";
  ring.style.borderColor = color;
  tapPad.appendChild(ring);
  setTimeout(() => ring.remove(), 420);

  const count = 7;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("div");
    p.className = "burst-particle";
    const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.5 - 0.25);
    const dist = 22 + Math.random() * 16;
    p.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    p.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    p.style.background = color;
    p.style.boxShadow = `0 0 6px ${color}`;
    tapPad.appendChild(p);
    setTimeout(() => p.remove(), 420);
  }
}

function flashLane(lane, sustain) {
  const hitLine = hitLineEls[lane];
  const tapPad = tapPadEls[lane];
  hitLine.style.background = LANE_COLORS[lane];
  hitLine.style.boxShadow = `0 0 16px ${LANE_COLORS[lane]}`;
  laneEls[lane].style.background = `linear-gradient(180deg, transparent, ${LANE_COLORS[lane]}22)`;
  tapPad.style.background = LANE_COLORS[lane] + "33";
  tapPad.style.borderColor = LANE_COLORS[lane];
  tapPad.classList.add("pressed");
  spawnBurst(lane);
  if (sustain) return; // caller (hold note) will clear this manually on release
  setTimeout(() => clearLaneFlash(lane), 110);
}

function clearLaneFlash(lane) {
  const hitLine = hitLineEls[lane];
  const tapPad = tapPadEls[lane];
  hitLine.style.background = "rgba(201,162,75,.35)";
  hitLine.style.boxShadow = "none";
  laneEls[lane].style.background = "transparent";
  tapPad.style.background = "rgba(255,255,255,.04)";
  tapPad.style.borderColor = LANE_COLORS[lane] + "55";
  tapPad.classList.remove("pressed");
}

function updateHud() {
  scoreValEl.textContent = score.toLocaleString();
  comboValEl.textContent = combo;
  comboValEl.style.color = combo > 0 ? "#C9A24B" : "#5b6169";
}

function pressLane(lane) {
  if (playingEl.style.display === "none") return;
  const t = audio.currentTime;

  let best = null, bestDt = Infinity;
  for (const n of notes) {
    if (n.lane !== lane || n.hit || n.missed || n.holding) continue;
    const dt = t - n.t;
    if (Math.abs(dt) < Math.abs(bestDt)) { bestDt = dt; best = n; }
  }

  if (best && Math.abs(bestDt) <= WINDOW_MISS) {
    const result = judge(bestDt);
    if (best.dur > 0) {
      // hold note: lock in the visual press, defer scoring until release/completion
      best.holding = true;
      best.initialJudge = result;
      flashLane(lane, true);
      spawnPopup(lane, "HOLD", LANE_COLORS[lane]);
    } else {
      flashLane(lane, false);
      finalizeNote(best, result);
    }
  } else {
    flashLane(lane, false);
    spawnPopup(lane, "-", "#555");
  }
}

function releaseLane(lane) {
  clearLaneFlash(lane);
  const t = audio.currentTime;
  const held = notes.find((n) => n.lane === lane && n.holding);
  if (!held) return;

  const endTime = held.t + held.dur;
  if (t < endTime - 0.12) {
    // released early
    const heldRatio = (t - held.t) / held.dur;
    finalizeHold(held, heldRatio < 0.5 ? "MISS" : "OK");
  } else {
    finalizeHold(held, held.initialJudge);
  }
}

function finalizeHold(note, quality) {
  note.holding = false;
  finalizeNote(note, quality);
}

function finalizeNote(note, quality) {
  note.hit = true;
  if (note.el) { note.el.remove(); note.el = null; }
  const lane = note.lane;
  if (quality === "PERFECT") {
    score += 300; combo += 1; maxCombo = Math.max(maxCombo, combo);
    judgeCounts.PERFECT++; spawnPopup(lane, "PERFECT", LANE_COLORS[lane]);
  } else if (quality === "GOOD") {
    score += 150; combo += 1; maxCombo = Math.max(maxCombo, combo);
    judgeCounts.GOOD++; spawnPopup(lane, "GOOD", LANE_COLORS[lane]);
  } else if (quality === "OK") {
    score += 50; combo += 1; maxCombo = Math.max(maxCombo, combo);
    judgeCounts.OK++; spawnPopup(lane, "OK", "#8a8a8a");
  } else {
    combo = 0;
    judgeCounts.MISS++; spawnPopup(lane, "MISS", "#6b7480");
  }
  updateHud();
}

function resetGame() {
  const diff = DIFFICULTIES[selectedDiff];
  LEAD_TIME = diff.leadTime;
  WINDOW_PERFECT = diff.wPerfect;
  WINDOW_GOOD = diff.wGood;
  WINDOW_MISS = diff.wMiss;
  hudDiffEl.textContent = diff.label.toUpperCase();

  const song = SONGS[selectedSong];
  document.getElementById("playBg").style.backgroundImage = `url("${song.bgSrc}")`;

  score = 0; combo = 0; maxCombo = 0;
  judgeCounts = { PERFECT: 0, GOOD: 0, OK: 0, MISS: 0 };
  const chart = song.notes[selectedDiff];
  notes = chart.map(([t, lane, dur], i) => ({ id: i, t, lane, dur: dur || 0, hit: false, missed: false, holding: false, initialJudge: null, el: null }));
  laneKeyDown = [false, false, false, false];
  buildLanes();
  updateHud();
}

function tick() {
  const t = audio.currentTime;

  for (const n of notes) {
    if (n.hit || n.missed) continue;

    if (n.holding) {
      // actively being held: keep the bar's trailing edge visible, auto-complete at the end
      const endTime = n.t + n.dur;
      if (n.el) {
        const tailDt = endTime - t;
        const tailProgress = 1 - tailDt / LEAD_TIME;
        const topPct = Math.max(0, tailProgress * HIT_Y);
        n.el.style.top = topPct + "%";
        n.el.style.height = Math.max(HIT_Y - topPct, 2) + "%";
      }
      if (t >= endTime - 0.05) {
        finalizeHold(n, n.initialJudge);
      }
      continue;
    }

    const dt = n.t - t;
    if (dt <= LEAD_TIME && dt >= -0.3) {
      if (!n.el) {
        const el = document.createElement("div");
        el.className = "note";
        el.style.background = `linear-gradient(180deg, ${LANE_COLORS[n.lane]}, ${LANE_COLORS[n.lane]}cc)`;
        el.style.boxShadow = `0 0 10px ${LANE_COLORS[n.lane]}99`;
        if (n.dur > 0) el.style.borderRadius = "8px";
        noteContainerEls[n.lane].appendChild(el);
        n.el = el;
      }
      if (n.dur > 0) {
        // hold note: render as a bar spanning [head=t, tail=t+dur]
        const headDt = n.t - t;
        const tailDt = (n.t + n.dur) - t;
        const headProgress = 1 - headDt / LEAD_TIME;
        const tailProgress = 1 - tailDt / LEAD_TIME;
        const bottomPct = headProgress * HIT_Y;
        const topPct = Math.max(0, tailProgress * HIT_Y);
        n.el.style.top = topPct + "%";
        n.el.style.height = Math.max(bottomPct - topPct, 6) + "%";
      } else {
        const progress = 1 - dt / LEAD_TIME;
        n.el.style.top = (progress * HIT_Y) + "%";
      }
    } else if (dt < -0.3 && n.el) {
      n.el.remove();
      n.el = null;
    }

    if (!n.hit && !n.missed && t - n.t > WINDOW_MISS) {
      n.missed = true;
      combo = 0;
      judgeCounts.MISS++;
      if (n.el) { n.el.remove(); n.el = null; }
      updateHud();
    }
  }

  if (audio.ended || (audio.duration && t >= audio.duration - 0.05)) {
    showResult();
    return;
  }
  rafId = requestAnimationFrame(tick);
}

function showResult() {
  playingEl.style.display = "none";
  resultEl.style.display = "block";

  const total = judgeCounts.PERFECT + judgeCounts.GOOD + judgeCounts.OK + judgeCounts.MISS;
  const accuracy = total > 0
    ? (((judgeCounts.PERFECT * 300 + judgeCounts.GOOD * 150 + judgeCounts.OK * 50) / (total * 300)) * 100).toFixed(1)
    : "0.0";
  let rank = "C";
  const acc = parseFloat(accuracy);
  if (acc >= 95) rank = "S";
  else if (acc >= 88) rank = "A";
  else if (acc >= 75) rank = "B";

  document.getElementById("rankVal").textContent = rank;
  document.getElementById("accVal").textContent = `${SONGS[selectedSong].title} · ${DIFFICULTIES[selectedDiff].label} · 정확도 ${accuracy}%`;

  const grid = document.getElementById("statGrid");
  grid.innerHTML = `
    <div class="stat-key">SCORE</div><div style="font-weight:700;color:#F3E9D2">${score.toLocaleString()}</div>
    <div class="stat-key">MAX COMBO</div><div style="font-weight:700;color:#F3E9D2">${maxCombo}</div>
    <div style="color:#C9A24B">PERFECT</div><div>${judgeCounts.PERFECT}</div>
    <div style="color:#B5673A">GOOD</div><div>${judgeCounts.GOOD}</div>
    <div style="color:#8a8a8a">OK</div><div>${judgeCounts.OK}</div>
    <div style="color:#6b7480">MISS</div><div>${judgeCounts.MISS}</div>
  `;
}

function startGame() {
  introEl.style.display = "none";
  resultEl.style.display = "none";
  playingEl.style.display = "block";
  resetGame();

  audio.src = SONGS[selectedSong].audioSrc;
  audio.currentTime = 0;
  const playPromise = audio.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch((err) => console.error("audio play failed", err));
  }
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
}

document.getElementById("startBtn").addEventListener("pointerdown", startGame);
document.getElementById("retryBtn").addEventListener("pointerdown", startGame);
document.getElementById("changeLink").addEventListener("pointerdown", () => {
  resultEl.style.display = "none";
  introEl.style.display = "block";
  refreshIntro();
});

window.addEventListener("keydown", (e) => {
  const idx = LANE_KEYS.indexOf(e.key.toUpperCase());
  if (idx !== -1) {
    e.preventDefault();
    if (!laneKeyDown[idx]) { laneKeyDown[idx] = true; pressLane(idx); }
  }
  if (e.key === " ") {
    e.preventDefault();
    if (playingEl.style.display === "none") {
      if (introEl.style.display !== "none") startGame();
      else if (resultEl.style.display !== "none") startGame();
    }
  }
});

window.addEventListener("keyup", (e) => {
  const idx = LANE_KEYS.indexOf(e.key.toUpperCase());
  if (idx !== -1) {
    laneKeyDown[idx] = false;
    releaseLane(idx);
  }
});

buildKeysRow();
refreshIntro();
</script>
</body>
</html>
